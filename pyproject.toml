[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spatial-microenvironment-profiler"
version = "0.1.0"
description = "End-to-end spatial transcriptomics (Visium HD) and PyTorch morphological phenotyping toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Udit Choudhary", email = "udit2400@gmail.com" }
]
keywords = [
    "spatial-transcriptomics",
    "computational-biology",
    "visium-hd",
    "computer-vision",
    "cell-type-deconvolution",
    "squidpy",
    "scanpy",
    "pytorch"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "anndata>=0.10.0",
    "scanpy>=1.10.0",
    "squidpy>=1.5.0",
    "scipy>=1.11.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=10.0.0",
    "pyarrow>=15.0.0",
    "scikit-misc>=0.3.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]
extended = [
    "scvi-tools>=1.1.0",
    "hotspot-sc>=1.1.1",
    "timm>=0.9.16",
]

[project.scripts]
spatial-profiler = "spatial_profiler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spatial_profiler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "B905", "W291", "W293", "F541", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

